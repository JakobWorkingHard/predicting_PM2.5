# Gemensamma inställningar för projektet.

[paths]
# Anges som relativa sökvägar från projektets rot
raw_dir = "data/raw"              # rådata från API:erna, versionshanteras
merged_dir = "data/merged"        # Mergad raw data
validated_dir = "data/validated"  # validerad data, inte interpolerad
processed_dir = "data/processed"  # rensad data, skapas av koden, versionshanteras inte
models_dir = "models"
champion_log = "logs/champion_log.csv"  # historik: vinnande modell + timestamp per körning
forskjuten_log = "logs/forskjuten_log.csv"  # egen logg för förskjuna championer (måltidsväder) – HÅLLS SKILT från champion_log så champion_is_fresh inte påverkas
datakontroll_log = "logs/datakontroll.csv"
jamfordelse_log = "logs/jamfordelse_forskjuten.csv"  # head-to-head: champion vs förskjuten champion vs baseline

[paths.filenames]
# {}-placeholders ersätts i config.py med värden från TOML
train_pm25              = "train_{pm25_station}_{train_start}_{train_slut}_pm25tidsserie_{pm25_tidsserie_id}.csv"
train_vader             = "train_{vaderstation}_{train_start}_{train_slut}_vaderstationid_{vaderstation_id}.csv"
train_merged            = "train_merged_{train_start}_{train_slut}_pm25tidsserie_{pm25_tidsserie_id}_vaderstationid_{vaderstation_id}.csv"
# Förskjuten modellinje (måltidsväder): bearbetade dataset där värdet i
# väderkolumnerna på rad T kommer från T + horisont. Testvarianten byggs
# men utvärderas först i den framtida engångsutvärderingen.
train_processed_forskjuten = "train_processed_forskjuten_{train_start}_{train_slut}_h{horisont}.csv"
val_processed_forskjuten   = "val_processed_forskjuten_{validering_start}_{validering_slut}_h{horisont}.csv"
train_validated         = "train_validated_{train_start}_{train_slut}.csv"
train_processed         = "train_processed_{train_start}_{train_slut}.csv"
val_validated           = "val_validated_{validering_start}_{validering_slut}.csv"
val_processed           = "val_processed_{validering_start}_{validering_slut}.csv"
val_pm25 = "val_{pm25_station}_{validering_start}_{validering_slut}_pm25tidsserie_{pm25_tidsserie_id}.csv"
val_vader = "val_{vaderstation}_{validering_start}_{validering_slut}_vaderstationid_{vaderstation_id}.csv"
val_merged = "val_merged_{validering_start}_{validering_slut}_pm25tidsserie_{pm25_tidsserie_id}_vaderstationid_{vaderstation_id}.csv"

# Testdata
test_pm25 = "test_{pm25_station}_{test_start}_{test_slut}_pm25tidsserie_{pm25_tidsserie_id}.csv"
test_vader = "test_{vaderstation}_{test_start}_{test_slut}_vaderstationid_{vaderstation_id}.csv"
test_merged = "test_merged_{test_start}_{test_slut}_pm25tidsserie_{pm25_tidsserie_id}_vaderstationid_{vaderstation_id}.csv"
test_validated = "test_validated_{test_start}_{test_slut}.csv"
test_processed = "test_processed_{test_start}_{test_slut}.csv"






[api]
luft = "https://datavardluft.smhi.se/52North/api"
vader = "https://opendata-download-metobs.smhi.se/api/version/1.0"

[model]
horisont = 6 # Prognosshorisont i timmar
# Vilken metric som avgör bäst modell. 
# Måste matcha en kolumn i results_df exakt. Giltiga alternativ:
#   "Validation MAE"      (lägre är bättre)
#   "Validation RMSE"     (lägre är bättre)
#   "Validation R²"       (högre är bättre)
#   "Validation MSE"      (lägre är bättre)
selection_metric = "Validation R²" 
random_state = 42
antal_dagar_sedan = 7  # champion räknas som färsk om tränad inom detta antal dagar
target_column = "target"        # namn på målvariabeln i processade filer

[model.features]
# Features som modellerna ska använda
columns = [
    "pm25",
    "Lufttemperatur",
    "vind_sin",
    "vind_cos",
    "Vindhastighet",
    "Relativ luftfuktighet",
    "Nederbördsmängd",
    "timme_sin",
    "timme_cos",
    "helg",
    "helg_timme_sin",
    "helg_timme_cos",
]

[model.forskjuten]
# Förskjuten modellinje: måltidsväder. Vädrets värde på rad T hämtas från
# T + horisont (från [model] ovan), dvs. vädret som råder när PM2.5-målet
# realiseras. OBS: vid live-prediktion ska väder-slotten fylls med en
# VÄDERPROGNOS för T + horisont (inte en observation) – träning och live
# måste använda samma slot-alignment (se docs/evaluation.md).

# Råa väderkolumner i merged-filerna som ersätts med måltidsväder.
# Vindriktning skiftas före sin/cos-omvandlingen, så vind-feature:n följer med.
vaderkolumner = [
    "Lufttemperatur",
    "Vindriktning",
    "Vindhastighet",
    "Relativ luftfuktighet",
    "Nederbördsmängd",
]
antal_dagar_sedan = 7  # förskjuten champion räknas som färsk om tränad inom detta antal dagar

[time]
train_start = "2023-05-26"  # när PM2.5-tidsserien startade
train_slut = "2025-12-31"
validering_start = "2026-01-01"
validering_slut = "2026-05-31"


[station.pm25]
# Det är ca 4 km mellan stationerna, men ingen mätstation närmare Malmö A mäter PM2.5
namn = "Malmö Dalaplan"
tidsserie_id = 6247         # aktiv sedan 2023-05-26, täcker hela perioden
lat = 55.584747
lon = 13.006230

[station.vader]
namn = "Malmö A"
id = 52350                  # SMHI CORE-station, data sedan 1990
lat = 55.5715
lon = 13.0708
# Väder-Parametrar vi vill extrahera från vårt väder-api
parametrar = { "Lufttemperatur" = 1, "Vindriktning" = 3, "Vindhastighet" = 4, "Relativ luftfuktighet" = 6, "Nederbördsmängd" = 7 }